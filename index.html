<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ပအိုဝ်ႏအဘိဓာႏသုဲင်ꩻ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #10b981;
      --border: #334155;
    }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; margin: 0; color: var(--primary); }
    .container { max-width: 600px; margin: auto; padding: 1.5rem; }
    .search-box { width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 1rem; margin-bottom: 1.5rem; box-sizing: border-box; }
    .word-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .word-pao { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin: 0 0 5px 0; }
    .badge { background: rgba(16, 185, 129, 0.15); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 0.9rem; }
    .nav-links { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>

  <header>
    <h1>📖 ပအိုဝ်ႏအဘိဓာႏသုဲင်ꩻ</h1>
    <div class="nav-links">
      <button class="btn" onclick="openAddModal()">+ စကားလုံးတင်မည်</button>
      <a href="dashboard.html" class="btn" style="background: #3b82f6;"><i class="fa-solid fa-lock"></i> စိစစ်ရေး</a>
    </div>
  </header>

  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="စကားလုံး သို့မဟုတ် မြန်မာအဓိပ္ပာယ် ရှာရန်..." oninput="renderViewerWords()">
    <div id="wordListDisplay"></div>
  </div>

  <!-- စကားလုံးတင်သွင်းရန် Modal -->
  <div id="addWordModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; padding:1rem;">
    <div style="background:var(--card-bg); padding:1.5rem; border-radius:12px; width:100%; max-width:450px; border:1px solid var(--border);">
      <h3>စကားလုံးအသစ် တင်သွင်းရန်</h3>
      <form onsubmit="handleContributorSubmit(event)">
        <input type="text" id="cName" placeholder="တင်သွင်းသူ နာမည်" class="search-box" required style="margin-bottom:10px;">
        <input type="text" id="cPao" placeholder="ပအိုဝ်ႏစကားလုံး" class="search-box" required style="margin-bottom:10px;">
        <input type="text" id="cType" placeholder="စကားလုံးအမျိုးအစား (ဥပမာ- နាមဝိသေသန)" class="search-box" required style="margin-bottom:10px;">
        <input type="text" id="cMeaning" placeholder="မြန်မာအဓိပ္ပာယ်" class="search-box" required style="margin-bottom:10px;">
        <input type="text" id="cExample" placeholder="သုံးစွဲပုံ ဥပမာ (လိုလျှင်)" class="search-box" style="margin-bottom:15px;">
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn" style="background:#64748b;" onclick="closeModal('addWordModal')">ပိတ်မည်</button>
          <button type="submit" class="btn">ပေးပို့မည်</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastMsg" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#10b981; color:#fff; padding:10px 20px; border-radius:8px;"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
